<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#6B3E19"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="460" rx="190" ry="24" fill="#000000" opacity="0.2"/>

  <!-- Chair -->
  <rect x="186" y="240" width="140" height="150" rx="20" fill="#1E293B"/>

  <!-- Student Puzzled / Scratching Head -->
  <g id="puzzled_student" filter="url(#shadow)">
    <path d="M196 280 C196 250, 316 250, 316 280 L320 380 L192 380 Z" fill="url(#blazer)"/>
    <polygon points="256,280 266,340 246,340" fill="#FFFFFF"/>
    <polygon points="256,290 262,360 250,360" fill="url(#gold)"/>

    <!-- Left Arm Resting on Desk Pondering -->
    <path d="M200 290 L170 360 L210 365" stroke="url(#blazer)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="215" cy="365" r="14" fill="url(#skin)"/>

    <!-- Right Arm Scratching Head -->
    <path d="M312 290 L360 230 L320 170" stroke="url(#blazer)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="312" cy="165" r="15" fill="url(#skin)"/> <!-- Hand Scratching Head -->

    <!-- Head Tilted Questioningly -->
    <g transform="rotate(8 256 195)">
      <ellipse cx="256" cy="195" rx="50" ry="56" fill="url(#skin)"/>
      <path d="M206 180 C206 125, 306 125, 306 180 C290 145, 222 145, 206 180 Z" fill="#18181B"/>
      <circle cx="206" cy="195" r="12" fill="url(#skin)"/>
      <circle cx="306" cy="195" r="12" fill="url(#skin)"/>

      <!-- Glasses -->
      <rect x="225" y="180" width="28" height="22" rx="6" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <rect x="260" y="180" width="28" height="22" rx="6" fill="none" stroke="#F59E0B" stroke-width="4"/>
      <line x1="253" y1="191" x2="260" y2="191" stroke="#F59E0B" stroke-width="4"/>

      <!-- Puzzled / Thoughtful Eyes -->
      <circle cx="236" cy="191" r="4.5" fill="#0F172A"/>
      <circle cx="276" cy="189" r="4.5" fill="#0F172A"/>

      <!-- Wavy Pondering Mouth (Hmm, let me re-check this formula...) -->
      <path d="M242 225 Q256 218 270 225" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Floating Thoughtful Question Mark Above Head -->
    <g transform="translate(320, 80)">
      <circle cx="24" cy="24" r="24" fill="#F59E0B"/>
      <text x="24" y="34" fill="#0F172A" font-family="system-ui, sans-serif" font-size="30" font-weight="900" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- Large Study Desk in Foreground -->
  <polygon points="60,370 452,370 492,410 20,410" fill="url(#deskWood)"/>
  <rect x="20" y="410" width="472" height="24" rx="4" fill="#78350F"/>
  <rect x="40" y="434" width="24" height="60" fill="#451A03"/>
  <rect x="448" y="434" width="24" height="60" fill="#451A03"/>

  <!-- Textbook & Calculator -->
  <polygon points="210,380 290,380 305,405 195,405" fill="#F8FAFC"/>
  <rect x="360" y="378" width="56" height="30" rx="5" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="366" y="382" width="44" height="10" rx="2" fill="#EAB308"/> <!-- Yellow Review Screen -->
</svg>
