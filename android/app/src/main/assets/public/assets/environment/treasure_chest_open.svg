<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="chestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="450" rx="150" ry="26" fill="#000000" opacity="0.3"/>

  <!-- OPEN CHEST WITH GLOWING PARTICLES & GEMS BURSTING OUT -->
  <g filter="url(#chestGlow)">
    <!-- Swung Open Lid Tilted Backward in Perspective -->
    <path d="M106 200 C106 70, 406 70, 406 200 Z" fill="url(#chestWood)" stroke="#451A03" stroke-width="8" transform="rotate(-35 256 160)"/>
    <path d="M156 200 C156 90, 192 90, 192 200 Z" fill="url(#chestGold)" transform="rotate(-35 256 160)"/>
    <path d="M320 200 C320 90, 356 90, 356 200 Z" fill="url(#chestGold)" transform="rotate(-35 256 160)"/>

    <!-- Chest Lower Box -->
    <rect x="116" y="240" width="280" height="180" rx="16" fill="url(#chestWood)" stroke="#451A03" stroke-width="8"/>
    <!-- Gold Bands -->
    <rect x="156" y="240" width="36" height="180" fill="url(#chestGold)"/>
    <rect x="320" y="240" width="36" height="180" fill="url(#chestGold)"/>
    <rect x="96" y="230" width="320" height="26" rx="6" fill="url(#chestGold)" stroke="#A16207" stroke-width="4"/>

    <!-- Latch Open -->
    <rect x="236" y="245" width="40" height="40" rx="6" fill="url(#chestGold)" stroke="#A16207" stroke-width="3"/>
    <circle cx="256" cy="265" r="7" fill="#451A03"/>

    <!-- Glowing Heap of Gold Coins & Diamonds Overflowing -->
    <ellipse cx="256" cy="230" rx="120" ry="35" fill="url(#chestGold)"/>
    <!-- Multiple Gold Coins -->
    <circle cx="210" cy="220" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="240" cy="215" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="270" cy="215" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="300" cy="220" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="230" cy="235" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="260" cy="235" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>
    <circle cx="285" cy="235" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/>

    <!-- Radiant Blue Diamonds (XP Gems) -->
    <polygon points="256,150 274,175 256,200 238,175" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2"/>
    <polygon points="190,170 205,190 190,210 175,190" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2"/>
    <polygon points="320,170 335,190 320,210 305,190" fill="#60A5FA" stroke="#1D4ED8" stroke-width="2"/>

    <!-- Revision Formula Scroll -->
    <rect x="210" y="180" width="90" height="25" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" transform="rotate(-10 255 192)"/>
    <line x1="220" y1="188" x2="270" y2="182" stroke="#94A3B8" stroke-width="2"/>
    <line x1="220" y1="194" x2="265" y2="188" stroke="#94A3B8" stroke-width="2"/>

    <!-- Sparkles Bursting Out -->
    <polygon points="256,80 262,96 278,98 266,108 270,124 256,116 242,124 246,108 234,98 250,96" fill="#FEF08A"/>
    <polygon points="150,110 154,122 166,124 157,132 160,144 150,138 140,144 143,132 134,124 146,122" fill="#FEF08A"/>
    <polygon points="360,110 364,122 376,124 367,132 370,144 360,138 350,144 353,132 344,124 356,122" fill="#FEF08A"/>
  </g>
</svg>
