<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="eagleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="eagleFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="eagleBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Speed Motion Trails -->
  <path d="M50 200 L160 200" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M20 256 L180 256" stroke="url(#eagleGold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M60 310 L150 310" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Flying Sabi Eagle (Wide Spread Wings) -->
  <g transform="translate(40, 10)">
    <!-- Left Wing Spread -->
    <path d="M200 240 C140 180, 40 110, 10 90 C40 160, 90 220, 180 270 Z" fill="url(#eagleFeather)"/>
    <path d="M190 250 C130 200, 50 140, 30 130 C60 180, 110 230, 180 270 Z" fill="url(#eagleGold)" opacity="0.7"/>

    <!-- Right Wing Spread High -->
    <path d="M260 240 C320 180, 420 110, 450 90 C420 160, 370 220, 280 270 Z" fill="url(#eagleFeather)"/>
    <path d="M270 250 C330 200, 410 140, 430 130 C400 180, 350 230, 280 270 Z" fill="url(#eagleGold)" opacity="0.7"/>

    <!-- Tail Streamers -->
    <polygon points="210,320 230,420 220,320" fill="#1E3A8A"/>
    <polygon points="230,320 250,440 240,320" fill="url(#eagleGold)"/>
    <polygon points="250,320 270,420 260,320" fill="#1E3A8A"/>

    <!-- Torso -->
    <ellipse cx="230" cy="270" rx="60" ry="70" fill="url(#eagleFeather)"/>
    <path d="M195 240 Q230 320 265 240 Q230 340 195 240 Z" fill="url(#eagleGold)"/>

    <!-- Forward Thrust Head -->
    <circle cx="230" cy="180" r="55" fill="#FFFFFF"/>
    <!-- Mortarboard cap tilted forward for aerodynamics -->
    <polygon points="230,95 285,125 230,135 175,125" fill="#1E3A8A"/>
    <rect x="190" y="130" width="80" height="12" rx="4" fill="url(#eagleGold)"/>

    <!-- Eagle Eyes (Determined Forward Focus) -->
    <ellipse cx="210" cy="175" rx="10" ry="12" fill="#0F172A"/>
    <circle cx="212" cy="172" r="4" fill="url(#eagleGold)"/>
    <circle cx="213" cy="170" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="250" cy="175" rx="10" ry="12" fill="#0F172A"/>
    <circle cx="248" cy="172" r="4" fill="url(#eagleGold)"/>
    <circle cx="247" cy="170" r="1.5" fill="#FFFFFF"/>

    <!-- Beak Piercing Forward -->
    <polygon points="220,185 240,185 230,230" fill="url(#eagleBeak)"/>
  </g>
</svg>
