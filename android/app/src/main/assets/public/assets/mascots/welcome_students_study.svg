<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="maleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="femaleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A26B38"/>
      <stop offset="100%" stop-color="#6E401F"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="blueBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="465" rx="360" ry="26" fill="#000000" opacity="0.2"/>

  <!-- ==================== STUDY ROOM BACKGROUND ACCENTS ==================== -->
  <!-- Ambient Wall Floating Bookshelf -->
  <rect x="250" y="50" width="300" height="12" rx="4" fill="#64748B" opacity="0.4"/>
  <!-- Books on Shelf -->
  <rect x="270" y="20" width="18" height="30" rx="3" fill="#2563EB"/>
  <rect x="290" y="15" width="22" height="35" rx="3" fill="#F59E0B"/>
  <rect x="314" y="25" width="16" height="25" rx="3" fill="#10B981"/>
  <rect x="460" y="18" width="20" height="32" rx="3" fill="#8B5CF6"/>
  <rect x="482" y="22" width="16" height="28" rx="3" fill="#EC4899"/>
  <!-- Small Plant on Shelf -->
  <ellipse cx="380" cy="45" rx="12" ry="8" fill="#B45309"/>
  <path d="M375 40 Q370 25 380 20 Q390 25 385 40 Z" fill="#22C55E"/>

  <!-- ==================== MALE STUDENT (LEFT) ==================== -->
  <g id="male_student" filter="url(#sceneShadow)">
    <!-- Chair Back -->
    <rect x="130" y="220" width="110" height="150" rx="18" fill="#1E293B"/>

    <!-- Body / Royal Blue Shirt -->
    <path d="M140 260 C140 230, 240 230, 240 260 L245 380 L135 380 Z" fill="url(#blueBlazer)"/>
    <polygon points="190,260 200,310 180,310" fill="#FFFFFF"/>
    <polygon points="190,270 195,330 185,330" fill="url(#goldYellow)"/>

    <!-- Left Arm Typing on Laptop -->
    <path d="M145 270 L180 340 L240 355" stroke="url(#blueBlazer)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="245" cy="355" r="12" fill="url(#maleSkin)"/>

    <!-- Right Arm Operating Mouse / Notes -->
    <path d="M235 270 L260 340 L285 355" stroke="url(#blueBlazer)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="290" cy="355" r="12" fill="url(#maleSkin)"/>

    <!-- Head & Neck -->
    <ellipse cx="190" cy="175" rx="42" ry="48" fill="url(#maleSkin)"/>
    <!-- Hair (Short fade curls) -->
    <path d="M152 165 C152 115, 230 115, 230 165 C215 135, 165 135, 152 165 Z" fill="#18181B"/>
    <circle cx="152" cy="175" r="10" fill="url(#maleSkin)"/>

    <!-- Glasses -->
    <rect x="165" y="160" width="24" height="18" rx="5" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <rect x="195" y="160" width="24" height="18" rx="5" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <line x1="189" y1="169" x2="195" y2="169" stroke="#F59E0B" stroke-width="3"/>

    <!-- Focused Eyes looking at laptop screen -->
    <circle cx="178" cy="169" r="3.5" fill="#0F172A"/>
    <circle cx="208" cy="169" r="3.5" fill="#0F172A"/>

    <!-- Confident Smile -->
    <path d="M178 195 Q190 205 204 195" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==================== FEMALE STUDENT (RIGHT) ==================== -->
  <g id="female_student" filter="url(#sceneShadow)">
    <!-- Chair Back -->
    <rect x="560" y="220" width="110" height="150" rx="18" fill="#1E293B"/>

    <!-- Body / Vibrant Yellow Gold Cardigan -->
    <path d="M560 260 C560 230, 660 230, 660 260 L665 380 L555 380 Z" fill="url(#goldYellow)"/>
    <polygon points="610,260 620,310 600,310" fill="#FFFFFF"/>
    <polygon points="610,270 615,330 605,330" fill="url(#blueBlazer)"/>

    <!-- Left Arm Pointing excitedly at screen -->
    <path d="M570 270 L530 330 L480 335" stroke="url(#goldYellow)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="475" cy="335" r="12" fill="url(#femaleSkin)"/>

    <!-- Right Arm Resting near keyboard -->
    <path d="M650 270 L620 340 L560 355" stroke="url(#goldYellow)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="555" cy="355" r="12" fill="url(#femaleSkin)"/>

    <!-- Head & Neck -->
    <ellipse cx="610" cy="175" rx="40" ry="46" fill="url(#femaleSkin)"/>
    <!-- Beautiful Braided Hair / Top Knot -->
    <circle cx="610" cy="115" r="28" fill="#18181B"/> <!-- Top Bun -->
    <path d="M570 170 C565 110, 655 110, 650 170 C640 130, 580 130, 570 170 Z" fill="#18181B"/>
    <circle cx="570" cy="175" r="9" fill="url(#femaleSkin)"/>
    <circle cx="650" cy="175" r="9" fill="url(#femaleSkin)"/>
    <!-- Gold Hoop Earrings -->
    <circle cx="570" cy="186" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="650" cy="186" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>

    <!-- Bright Joyful Eyes -->
    <circle cx="598" cy="168" r="3.5" fill="#0F172A"/>
    <circle cx="622" cy="168" r="3.5" fill="#0F172A"/>
    <!-- Eyebrows -->
    <path d="M592 160 Q598 155 604 160" stroke="#0F172A" stroke-width="2" fill="none"/>
    <path d="M616 160 Q622 155 628 160" stroke="#0F172A" stroke-width="2" fill="none"/>

    <!-- Big Delighted Smile -->
    <path d="M598 192 Q610 205 622 192 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <path d="M604 200 Q610 204 616 200" fill="#EF4444"/>
  </g>

  <!-- ==================== LARGE MODERN STUDY DESK (FOREGROUND) ==================== -->
  <g id="study_desk" filter="url(#sceneShadow)">
    <polygon points="50,350 750,350 780,395 20,395" fill="url(#deskGrad)"/>
    <rect x="20" y="395" width="760" height="24" rx="4" fill="#78350F"/>
    <rect x="60" y="419" width="30" height="50" fill="#451A03"/>
    <rect x="710" y="419" width="30" height="50" fill="#451A03"/>

    <!-- MALE STUDENT'S LAPTOP (LEFT) -->
    <!-- Base -->
    <polygon points="210,380 310,380 325,390 195,390" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <!-- Screen Opened Facing User at Angle -->
    <polygon points="215,310 305,310 310,380 210,380" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <!-- Screen Inner Glow with Sabi App -->
    <rect x="222" y="316" width="76" height="58" rx="3" fill="#1E3A8A"/>
    <!-- Mini Sabi Logo on Screen -->
    <circle cx="260" cy="340" r="10" fill="#F59E0B"/>
    <text x="260" y="360" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="middle">SABI CBT</text>

    <!-- FEMALE STUDENT'S LAPTOP (RIGHT) -->
    <!-- Base -->
    <polygon points="490,380 590,380 605,390 475,390" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <!-- Screen Opened -->
    <polygon points="495,310 585,310 590,380 490,380" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <!-- Screen Inner Glow -->
    <rect x="502" y="316" width="76" height="58" rx="3" fill="#1E3A8A"/>
    <!-- Progress Radar on her screen -->
    <polygon points="540,328 550,338 545,350 535,350 530,338" fill="#F59E0B" opacity="0.8"/>
    <text x="540" y="364" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">320/400 MOCK</text>

    <!-- STUDY PROPS ON TABLE CENTER -->
    <!-- Coffee Mug -->
    <rect x="360" y="358" width="22" height="26" rx="4" fill="#EF4444"/>
    <path d="M382 364 C388 364, 388 376, 382 376" fill="none" stroke="#EF4444" stroke-width="3"/>

    <!-- Stack of JAMB Past Questions Textbooks -->
    <rect x="400" y="372" width="60" height="14" rx="2" fill="#2563EB"/>
    <rect x="405" y="360" width="55" height="12" rx="2" fill="#F59E0B"/>
    <text x="432" y="370" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">JAMB 2026</text>

    <!-- Sabi Mascot Mini Figurine / Mascot Sticker on Table -->
    <circle cx="390" cy="380" r="8" fill="#FBBF24"/>
    <circle cx="390" cy="380" r="3" fill="#1E3A8A"/>
  </g>
</svg>
